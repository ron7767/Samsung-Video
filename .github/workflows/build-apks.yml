
name: Crear APKs de Samsung Video

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extraer proyecto
        run: |
          unzip -q SamsungVideo_Rebuild_MobileBuild.zip -d proyecto

      - name: Compilar Classic y Ultra
        working-directory: proyecto
        run: |
          gradle assembleClassicDebug assembleUltraDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-Video-APKs
          path: |
            proyecto/app/build/outputs/apk/classic/debug/*.apk
            proyecto/app/build/outputs/apk/ultra/debug/*.apk
          if-no-files-found: error
