name: Compilar Samsung Video

on:
  workflow_dispatch:

jobs:
  build:
    name: Crear APK Samsung Video
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extraer proyecto
        run: |
          unzip -q SamsungVideo_PROFESIONAL.zip -d proyecto

      - name: Verificar proyecto
        run: |
          test -f proyecto/settings.gradle.kts
          test -f proyecto/build.gradle.kts
          test -f proyecto/app/build.gradle.kts

      - name: Compilar APK
        working-directory: proyecto
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-Video
          path: proyecto/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
